<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الدخول — POS System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-700 to-blue-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-7">
      <div class="text-5xl mb-3">🏪</div>
      <h1 class="text-2xl font-black text-gray-800">POS System</h1>
      <p class="text-sm text-gray-400 mt-1">أدخل بياناتك للمتابعة</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 mb-5 text-sm font-medium">
      ⚠️ {{ error }}
    </div>
    {% endif %}

    <!-- Role Selector -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button type="button" onclick="setRole('employee')" id="role-employee"
        class="role-btn flex flex-col items-center gap-1 border-2 border-gray-200 rounded-2xl py-4 text-sm font-semibold text-gray-500 transition-all">
        <span class="text-2xl">👤</span>
        <span>موظف</span>
      </button>
      <button type="button" onclick="setRole('manager')" id="role-manager"
        class="role-btn flex flex-col items-center gap-1 border-2 border-gray-200 rounded-2xl py-4 text-sm font-semibold text-gray-500 transition-all">
        <span class="text-2xl">👑</span>
        <span>مدير</span>
      </button>
    </div>

    <form method="POST" action="{{ base }}/login" class="space-y-4">
      <input type="hidden" name="role" id="roleInput" value="employee"/>

      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1.5">اسم المستخدم</label>
        <input name="username" required autofocus autocomplete="username"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors"
          placeholder="أدخل اسم المستخدم"/>
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1.5">كلمة المرور</label>
        <input name="password" type="password" required autocomplete="current-password"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors"
          placeholder="••••••••"/>
      </div>

      <button type="submit"
        class="w-full bg-blue-700 hover:bg-blue-800 active:scale-95 text-white font-bold py-3.5 rounded-xl text-base transition-all shadow-md mt-2">
        دخول ←
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6">
      نظام نقطة البيع والمحاسبة
    </p>
  </div>

  <script>
    let selectedRole = 'employee';

    function setRole(r) {
      selectedRole = r;
      document.getElementById('roleInput').value = r;
      document.querySelectorAll('.role-btn').forEach(b => {
        b.classList.remove('border-blue-600','bg-blue-50','text-blue-700');
        b.classList.add('border-gray-200','text-gray-500');
      });
      const btn = document.getElementById('role-' + r);
      btn.classList.add('border-blue-600','bg-blue-50','text-blue-700');
      btn.classList.remove('border-gray-200','text-gray-500');
    }

    // Set default
    setRole('employee');

    {% if error and 'manager' in (request.form.get('role','')) %}
    setRole('manager');
    {% endif %}
  </script>
</body>
</html>
